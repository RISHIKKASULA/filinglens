[project]
name = "filinglens"
version = "0.1.0"
description = "XBRL-graded evaluation harness: how reliably can a local 7-8B LLM extract financial figures from SEC filing text?"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rishik Kasula", email = "contact.rishikkasula@gmail.com" }]
dependencies = [
    "edgartools>=3.0",
    "rank-bm25>=0.2",
    "ollama>=0.4",
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
filinglens = "filinglens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260518",
    "pandas-stubs>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["edgar.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=filinglens --cov-report=term-missing"

[tool.coverage.run]
source = ["src/filinglens"]
omit = ["src/filinglens/cli.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "# pragma: no cover"]
